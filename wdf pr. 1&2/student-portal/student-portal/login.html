    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Student Portal | Login</title>
    <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

    <header>
    <nav>
        <a href="index.html" class="logo">STARK</a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links"><span></span><span></span><span></span></button>
        <ul id="nav-links" class="nav-links">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="attendance.html">Attendance</a></li>
        <li><a href="timetable.html">Timetable</a></li>
        <li><a href="materials.html">Materials</a></li>
        <li><a href="notices.html">Notices</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="admin-login.html">Admin</a></li>
        <li><a href="login.html" class="btn-login active">Login</a></li>
        <li><a href="registration.html" class="btn-login">Registration</a></li>
        </ul>
    </nav>
</header>

    <main>
        <div class="form-container">
        <h2 style="margin-bottom: 0.5rem; text-align: center;">Student Login</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem;">Enter your credentials to access your account</p>
        
        <form class="login-form" action="index.html" method="GET" novalidate>
            <div class="form-group">
            <label for="enrollment">Enrollment Number</label>
            <input type="text" id="enrollment" name="enrollment" placeholder="e.g., 2100012345" required autocomplete="username">
            <small class="error-message"></small>
            </div>
            <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="********" required autocomplete="current-password">
            <small class="error-message"></small>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center; color: var(--text-soft);">New here? <a href="registration.html" class="link-text">Create an account</a>.</p>
        </form>
        </div>
    </main>

            <script src="js/main.js"></script>
    </body>
    </html>
