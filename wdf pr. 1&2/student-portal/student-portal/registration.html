<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">STARK</a>
            <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links"><span></span><span></span><span></span></button>
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="attendance.html">Attendance</a></li>
                <li><a href="timetable.html">Timetable</a></li>
                <li><a href="materials.html">Materials</a></li>
                <li><a href="notices.html">Notices</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="admin-login.html">Admin</a></li>
                <li><a href="login.html" class="btn-login">Login</a></li>
                <li><a href="registration.html" class="btn-login">Registration</a></li>
                

            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2 style="margin-bottom: 0.5rem; text-align: center;">Student Registration</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem;">Create your account with the information below.</p>

            <form class="registration-form" action="index.html" method="GET" novalidate>
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="e.g., John Doe" autocomplete="name" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="enrollment">Enrollment Number</label>
                    <input type="text" id="enrollment" name="enrollment" placeholder="e.g., 2100012345" autocomplete="username" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="e.g., student@example.com" autocomplete="email" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="10-digit phone number" autocomplete="tel" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="birthday">Birthday</label>
                    <input type="date" id="birthday" name="birthday" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="********" autocomplete="new-password" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat your password" autocomplete="new-password" required>
                    <small class="error-message"></small>
                </div>

                <button type="submit" class="btn">Register</button>
                <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center; color: var(--text-soft);">Already have an account? <a href="login.html" class="link-text">Sign in here</a>.</p>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
